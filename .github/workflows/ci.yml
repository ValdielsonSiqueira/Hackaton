name: SeniorEase CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-unit-and-build:
    name: Build & Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Compilar pacotes do Monorepo
        run: |
          pnpm --filter @seniorease/core build
          pnpm --filter web build

      - name: Executar Testes Unitários (Vitest)
        run: pnpm --filter web test

  test-e2e:
    name: Testes End-to-End (Playwright)
    needs: test-unit-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Compilar pacotes do Monorepo
        run: |
          pnpm --filter @seniorease/core build

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar Testes E2E (Playwright)
        run: pnpm --filter web test:e2e

      - name: Upload Relatório Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
